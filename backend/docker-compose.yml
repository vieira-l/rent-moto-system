# Sobe um Postgres local para desenvolvimento/teste, sem precisar instalar nada
# além do Docker. Rode: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: motos
      POSTGRES_PASSWORD: motos
      POSTGRES_DB: motos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
